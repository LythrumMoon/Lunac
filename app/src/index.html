<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lunac</title>
  <link rel="stylesheet" href="/styles.css" />
  <!-- KaTeX for math formula rendering
       media="print" + onload swap = non-render-blocking: a slow CDN no longer
       holds first paint at boot (was a white-screen startup delay). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" media="print" onload="this.media='all'" />
  <noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" /></noscript>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, { delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false},
      {left: '\\[', right: '\\]', display: true},
    ], throwOnError: false, trust: true });">
  </script>
</head>
<body>
  <div id="app">
    <!-- Search bar (draggable) -->
    <div id="search-bar" data-tauri-drag-region>
      <!-- Input area: chips + text input, wraps for dynamic height -->
      <div id="search-input-area">
        <!-- File chips — inline before search input, wrap to new lines -->
        <div id="file-chips"></div>
        <textarea
          id="search-input"
          rows="1"
          placeholder="Search tools, files, or ask AI..."
          autocomplete="off"
          spellcheck="false"
          autofocus
        ></textarea>
      </div>
      <span id="search-hint" class="hidden"></span>
      <!-- Plugin bar — replaces input when a plugin is active -->
      <span id="plugin-bar-title" class="hidden" data-tauri-drag-region></span>
      <button id="plugin-bar-exit" class="hidden" title="Exit plugin (Esc)" aria-label="Exit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </g>
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
          <circle cx="7.2" cy="7.2" r="1" fill="currentColor" stroke="none"/>
          <circle cx="16.6" cy="16.6" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
        </svg>
      </button>
      <!-- Settings button — 印象派齿轮（示例）：
           扫笔残影(左上偏移淡描边) + 主体 + 点彩高光(左上密/右下疏) -->
      <button id="settings-btn" title="Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            <circle cx="12" cy="12" r="3"/>
          </g>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          <circle cx="12" cy="12" r="3"/>
          <circle cx="9" cy="8.4" r="1.15" fill="currentColor" stroke="none"/>
          <circle cx="6.7" cy="12.6" r="0.6" fill="currentColor" stroke="none" opacity="0.55"/>
          <circle cx="16" cy="16" r="0.55" fill="currentColor" stroke="none" opacity="0.35"/>
        </svg>
      </button>
    </div>

    <!-- Detached header (visible only in detached mode, replaces search bar) -->
    <div id="detached-header" class="hidden" data-tauri-drag-region>
      <button id="detached-back-btn" title="Restore search bar" aria-label="Restore">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
            <polyline points="15 18 9 12 15 6"/>
          </g>
          <polyline points="15 18 9 12 15 6"/>
          <circle cx="9.2" cy="10.6" r="1" fill="currentColor" stroke="none"/>
          <circle cx="14.5" cy="15.5" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
        </svg>
      </button>
      <span id="detached-title">Plugin</span>
      <button id="detached-vscode-btn" class="hidden" title="Open in VSCode" aria-label="Open in VSCode">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
            <polyline points="4 17 10 11 4 5"/>
            <line x1="12" y1="19" x2="20" y2="19"/>
          </g>
          <polyline points="4 17 10 11 4 5"/>
          <line x1="12" y1="19" x2="20" y2="19"/>
          <circle cx="7.5" cy="7" r="1" fill="currentColor" stroke="none"/>
          <circle cx="18" cy="17.6" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
        </svg>
      </button>
      <button id="detached-close-btn" title="Close plugin" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </g>
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
          <circle cx="7.2" cy="7.2" r="1" fill="currentColor" stroke="none"/>
          <circle cx="16.6" cy="16.6" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
        </svg>
      </button>
    </div>

    <!-- Results / Chat area -->
  <div id="results-container" class="hidden">
    <!-- 自定义背景图层（嵌入结果区/插件界面，随面板大小贴合，默认无图） -->
    <div id="app-bg-image"></div>
    <!-- AI history left drawer (golden ratio ~38.2%) -->
    <div id="chat-drawer" class="hidden">
      <div id="chat-drawer-header">
        <span>Conversations</span>
        <button id="chat-drawer-close" title="Close history">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </g>
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
            <circle cx="7.2" cy="7.2" r="1" fill="currentColor" stroke="none"/>
            <circle cx="16.6" cy="16.6" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
          </svg>
        </button>
      </div>
      <div id="chat-drawer-list"></div>
    </div>
    <div id="results-list"></div>
      <!-- Chat input bar (visible when AI chat is active) -->
      <div id="chat-input-bar" class="hidden">
        <!-- Chat file chips — same as search bar chips, shown in AI mode -->
        <div id="chat-file-chips"></div>
        <div id="chat-input-row">
          <button id="chat-add-file-btn" title="Add file" aria-label="Add file">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </g>
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
              <circle cx="7.5" cy="7.5" r="1" fill="currentColor" stroke="none"/>
              <circle cx="16.5" cy="16.5" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
            </svg>
          </button>
          <button id="chat-new-btn" title="New conversation" aria-label="New chat">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <line x1="12" y1="7" x2="12" y2="7.01"/>
            </g>
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <line x1="12" y1="7" x2="12" y2="7.01"/>
            <circle cx="7.5" cy="5.5" r="1" fill="currentColor" stroke="none"/>
            <circle cx="17.5" cy="18" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
          </svg>
        </button>
          <textarea id="chat-input" rows="1" placeholder="Type a message..." autocomplete="off" spellcheck="false"></textarea>
          <!-- 「更多」菜单：思考档位 / 命令运行方式 / 工作区 / 工具黑名单
               四个控件收在一个 ⋯ 里（图标参数见 docs/icon-style.md §1–§2）。 -->
          <div class="chat-more-wrap">
            <button id="chat-more-btn" title="More" aria-label="More">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
                  <line x1="5" y1="12" x2="5.01" y2="12"/>
                  <line x1="12" y1="12" x2="12.01" y2="12"/>
                  <line x1="19" y1="12" x2="19.01" y2="12"/>
                </g>
                <line x1="5" y1="12" x2="5.01" y2="12"/>
                <line x1="12" y1="12" x2="12.01" y2="12"/>
                <line x1="19" y1="12" x2="19.01" y2="12"/>
                <circle cx="16.4" cy="6.2" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
              </svg>
            </button>
            <div id="chat-more-menu" class="hidden">
              <!-- 思考档位：三档分段（图标由 main.ts 用既有 THINK_SVG 填入，不再造路径） -->
              <div class="chat-more-row">
                <span class="chat-more-ic" id="chat-more-think-ic"></span>
                <span class="chat-more-label" id="chat-more-think-label"></span>
                <div class="chat-more-seg" id="chat-mode-seg">
                  <button type="button" data-mode="fast"></button>
                  <button type="button" data-mode="think"></button>
                  <button type="button" data-mode="deep"></button>
                </div>
              </div>
              <!-- 命令运行方式：图标 + 档位点阵（不写档位名）+ 一句功能简述 -->
              <div class="chat-more-row">
                <button id="chat-runmode-btn" type="button">
                  <span class="rm-ic">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                      <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
                        <path d="M12 3l7 3v5.5c0 4.6-3 8-7 9.5-4-1.5-7-4.9-7-9.5V6z"/>
                      </g>
                      <path d="M12 3l7 3v5.5c0 4.6-3 8-7 9.5-4-1.5-7-4.9-7-9.5V6z"/>
                      <circle cx="9.2" cy="8.8" r="1" fill="currentColor" stroke="none"/>
                      <circle cx="15.4" cy="14.8" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
                    </svg>
                  </span>
                  <span class="rm-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                </button>
                <span class="chat-more-hint" id="chat-runmode-hint"></span>
              </div>
              <!-- 工作区：原独立弹窗的内容，扁平化成一行（无嵌套弹窗） -->
              <div class="chat-more-row chat-more-block">
                <span class="chat-more-ic">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
                      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    </g>
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                    <circle cx="7" cy="6" r="1" fill="currentColor" stroke="none"/>
                    <circle cx="17" cy="16.5" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
                  </svg>
                </span>
                <span class="chat-more-label" id="chat-more-workspace-label"></span>
                <div id="chat-workspace-path" class="chat-workspace-path" title=""></div>
                <div class="chat-more-actions">
                  <button id="chat-workspace-select" type="button"></button>
                  <button id="chat-workspace-reset" type="button"></button>
                </div>
              </div>
              <!-- 工具黑名单：勾选后重启 agent 生效（第19点前缀缓存优化） -->
              <div class="chat-more-row chat-more-block">
                <span class="chat-more-ic">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
                      <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </g>
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/>
                    <circle cx="16.5" cy="16.5" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
                  </svg>
                </span>
                <span class="chat-more-label chat-tools-title" id="chat-tools-title"></span>
                <div id="chat-tools-list" class="chat-tools-list"></div>
                <div class="chat-tools-actions">
                  <button id="chat-tools-save" type="button"></button>
                  <span id="chat-tools-msg" class="chat-tools-msg"></span>
                </div>
              </div>
            </div>
          </div>
          <button id="chat-history-btn" title="Chat History" aria-label="History">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </g>
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
              <circle cx="8.4" cy="7.2" r="1.05" fill="currentColor" stroke="none"/>
              <circle cx="16.4" cy="13.4" r="0.5" fill="currentColor" stroke="none" opacity="0.5"/>
            </svg>
          </button>
          <button id="chat-send-btn" title="Send" aria-label="Send message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </g>
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              <circle cx="8" cy="8" r="1" fill="currentColor" stroke="none"/>
              <circle cx="16.2" cy="15.8" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
            </svg>
          </button>
          <button id="chat-stop-btn" title="Stop generating" aria-label="Stop">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
              <rect x="3.3" y="3.3" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.28"/>
              <rect x="4" y="4" width="16" height="16" rx="2"/>
              <circle cx="8.6" cy="8.6" r="1.1" fill="#fff" opacity="0.75"/>
              <circle cx="16.4" cy="16.4" r="0.5" fill="#fff" opacity="0.4"/>
            </svg>
          </button>
          <button id="humanize-btn" title="去除 AI 痕迹" aria-label="Humanize" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <g opacity="0.28" transform="translate(-0.7,-0.7)" stroke-width="1.6">
                <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
              </g>
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
              <circle cx="9" cy="9" r="1" fill="currentColor" stroke="none"/>
              <circle cx="16" cy="16" r="0.5" fill="currentColor" stroke="none" opacity="0.45"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <!-- Status bar (always visible, bottom rounded) -->
    <div id="status-bar">
      <span id="status-text">Loading...</span>
      <span id="token-dashboard" class="hidden"></span>
      <span id="status-hint">Esc to close</span>
    </div>
  </div>

  <script type="module" src="/main.ts"></script>
  <!--
    ═══════════════════════════════════════════════════════════════════
    WebView2 Permission Guard — disable ALL Chromium permission dialogs.
    
    navigator.clipboard.read() would trigger the Chromium permission prompt.
    The Tauri clipboard plugin (native Win32 API) handles all clipboard
    operations without dialogs — we block the browser API entirely.
    ═══════════════════════════════════════════════════════════════════
  -->
  <script>
    (function() {
      // Block navigator.clipboard.read() — it triggers WebView2 permission dialog
      const _origRead = navigator.clipboard.read;
      navigator.clipboard.read = function() {
        return Promise.reject(new DOMException(
          'Clipboard read blocked by Lunac — use Tauri clipboard plugin instead',
          'NotAllowedError'
        ));
      };
      // Also silence permissions.query for clipboard
      const _origQuery = navigator.permissions.query;
      navigator.permissions.query = function(desc) {
        if (desc && (desc.name === 'clipboard-read' || desc.name === 'clipboard-write')) {
          return Promise.resolve({ state: 'granted', onchange: null });
        }
        return _origQuery.call(navigator.permissions, desc);
      };
    })();
  </script>
</body>
</html>
