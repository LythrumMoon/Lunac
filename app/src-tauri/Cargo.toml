[package]
name = "lunac"
version = "0.9.5"
edition = "2021"
description = "Lunac - Native AI coding assistant with local + cloud hybrid inference"

[package.metadata]
# Tauri build metadata

[dependencies]
tauri = { version = "2.5", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }
# 纯 Rust 7z 解压 —— PaddleOCR-json 的 Windows 发行包是 .7z（无 .zip 资产）
sevenz-rust = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tokio = { version = "1", features = ["sync", "macros"] }
futures = "0.3"
dotenvy = "0.15"
base64 = "0.22"
# Spotify OAuth 的 PKCE（S256）需要 SHA-256；`percent-encoding` 用于拼授权 URL 与解回调查询串。
# 两者在依赖树里**本来就有**（sha2 0.10.9 / percent-encoding 2.3.2 已在 Cargo.lock），
# 这里只是提为直接依赖，不新增任何下载（见 music.rs 顶部说明）。
sha2 = "0.10"
percent-encoding = "2"
pinyin = { version = "0.11", features = ["plain"] }
winreg = "0.52"
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Foundation",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
