<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"><defs>
  <linearGradient id="gRose" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F7F1E8"/><stop offset=".5" stop-color="#C0A0A0"/><stop offset="1" stop-color="#8E525C"/>
  </linearGradient>
  <linearGradient id="gEmber" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0" stop-color="#C29B7C"/><stop offset="1" stop-color="#E3CDA8"/>
  </linearGradient>
  <linearGradient id="gMana" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#A8B0B8"/><stop offset="1" stop-color="#8E737E"/>
  </linearGradient>
  <linearGradient id="gDanger" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#B97A80"/><stop offset="1" stop-color="#7E484F"/>
  </linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F4EADA"/><stop offset=".5" stop-color="#E3CDA8"/><stop offset="1" stop-color="#D4B08A"/>
  </linearGradient>
  <linearGradient id="gMint" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E1E7D6"/><stop offset="1" stop-color="#A9B9A4"/>
  </linearGradient>
  <linearGradient id="gWin" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#302625"/><stop offset="1" stop-color="#1D1615"/>
  </linearGradient>
  <linearGradient id="gInk" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1D1615"/><stop offset="1" stop-color="#151011"/>
  </linearGradient>
  <linearGradient id="gGlass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".12"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/>
  </linearGradient>
  <!-- 纸面：给插画 / 空状态卡当底用 -->
  <linearGradient id="gPaper" x1="0" y1="0" x2=".4" y2="1">
    <stop offset="0" stop-color="#F5EEE3"/><stop offset=".55" stop-color="#EFE6D9"/><stop offset="1" stop-color="#E2D6C4"/>
  </linearGradient>
  <linearGradient id="gCloth" x1="0" y1="0" x2=".3" y2="1">
    <stop offset="0" stop-color="#C98C94"/><stop offset=".5" stop-color="#B06A73"/><stop offset="1" stop-color="#8E525C"/>
  </linearGradient>
  <!-- 柔光改「纸背阴影」：不是发光，是纸叠在纸上的暗角 -->
  <radialGradient id="rBloom" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#C0A0A0" stop-opacity=".22"/><stop offset="1" stop-color="#C0A0A0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rViolet" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#8E737E" stop-opacity=".22"/><stop offset="1" stop-color="#8E737E" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="rCore" cx=".5" cy=".45" r=".55">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".7"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gFade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C0A0A0" stop-opacity="0"/><stop offset=".5" stop-color="#C0A0A0"/><stop offset="1" stop-color="#C0A0A0" stop-opacity="0"/>
  </linearGradient>
  <!-- patHex：id 是契约，花纹换掉。六边形网格是科技感，与纸上墨线无关。
       改成参考图里的**植物蕾丝**：四瓣花 + 藤须。 -->
  <pattern id="patHex" width="28" height="28" patternUnits="userSpaceOnUse">
    <g fill="none" stroke="#C0A0A0" stroke-width=".9" opacity=".16" stroke-linecap="round">
      <path d="M14 8.4c-2 0-3.1 1.3-3.1 2.5 0 1.4 1.4 2.4 3.1 3.8 1.7-1.4 3.1-2.4 3.1-3.8 0-1.2-1.1-2.5-3.1-2.5Z"/>
      <path d="M14 16.2c-.6 1.6-1.5 2.4-2.8 2.8M14 16.2c.6 1.6 1.5 2.4 2.8 2.8"/>
      <path d="M14 21.4c-.5 1.3-1.3 2-2.4 2.3M14 21.4c.5 1.3 1.3 2 2.4 2.3"/>
      <circle cx="14" cy="12.6" r=".9"/>
      <circle cx="24" cy="26" r=".7"/><circle cx="4" cy="2" r=".7"/>
    </g>
  </pattern>
  <pattern id="patDots" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r=".9" fill="#E4D9C9" opacity=".18"/>
  </pattern>
  <pattern id="patLine" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#FFFFFF" opacity=".02"/>
  </pattern>
  <!-- 纸纤维：用确定性点纹理，不用 feTurbulence（resvg 支持不可靠，且 rect 无 fill 会默认黑底糊住纸面） -->
  <pattern id="patGrain" width="7" height="7" patternUnits="userSpaceOnUse">
    <circle cx="1.2" cy="1.6" r=".5" fill="#241E20" opacity=".10"/>
    <circle cx="4.6" cy="3.1" r=".4" fill="#241E20" opacity=".07"/>
    <circle cx="2.6" cy="5.6" r=".45" fill="#241E20" opacity=".08"/>
  </pattern>
  <filter id="fShadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0E0A0B" flood-opacity=".55"/>
  </filter>
  <filter id="fSoft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <filter id="fTight" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs><path d="M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" transform="translate(0.75,0.6)" fill="none" stroke="url(#gRose)" stroke-width="0.86" stroke-linecap="round" stroke-linejoin="round" opacity="0.200"/><path d="M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" fill="none" stroke="url(#gRose)" stroke-width="3.10" stroke-linecap="round" stroke-linejoin="round" opacity="0.080"/><path d="M18 11a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" fill="none" stroke="url(#gRose)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M16.65 16.65 21 21" transform="translate(0.75,0.6)" fill="none" stroke="url(#gRose)" stroke-width="0.86" stroke-linecap="round" stroke-linejoin="round" opacity="0.200"/><path d="M16.65 16.65 21 21" fill="none" stroke="url(#gRose)" stroke-width="3.10" stroke-linecap="round" stroke-linejoin="round" opacity="0.080"/><path d="M16.65 16.65 21 21" fill="none" stroke="url(#gRose)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M16.65 16.65 21 21" fill="none" stroke="#C29B7C" stroke-width="1.7" stroke-linecap="round"/><circle cx="7.2" cy="7.4" r="0.9" fill="#DCC3BF"/><circle cx="16.6" cy="16.6" r="0.5" fill="#DCC3BF"/></svg>