[package]
name = "agent"
version = "0.1.0"
edition = "2021"
description = "Lunac self-developed agent core — lunac 桌面端的 agent 后端（stream-json 契约）"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
# P1 内置工具：Glob 的模式匹配、Grep 的正则
glob = "0.3"
regex = "1"
# A8 图片附件：把按路径读出来的图片字节转成端点要的 base64（与 src-tauri 同版本）
base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
