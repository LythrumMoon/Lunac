[package]
name = "agent"
version = "0.1.0"
edition = "2021"
description = "Lunac self-developed agent core — lunac 桌面端的 agent 后端（stream-json 契约）"

[[bin]]
name = "agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
